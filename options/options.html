<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otto Options</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1><img class="logo" src="../icons/icon128.png" alt="" width="40" height="40" />Otto options</h1>
      <form id="form">
        <label>
          Provider
          <select id="provider"></select>
        </label>

        <label data-field="region">
          AWS region
          <input id="region" type="text" spellcheck="false" placeholder="us-east-1" />
          <small>Otto calls https://bedrock-mantle.&lt;region&gt;.api.aws/anthropic unless you set a base URL.</small>
        </label>

        <label data-field="baseUrl">
          Base URL
          <input id="baseUrl" type="url" spellcheck="false" />
          <small>Leave empty to use the default shown. Set it to reach the same API through a proxy or gateway (LiteLLM, Cloudflare AI Gateway), or another OpenAI-compatible server: OpenRouter (https://openrouter.ai/api/v1), Ollama (http://localhost:11434/v1), LM Studio (http://localhost:1234/v1). Otto asks for access to a new host when you save.</small>
        </label>

        <label data-field="auth">
          Authentication
          <select id="auth">
            <option value="apiKey">Bedrock API key</option>
            <option value="sigv4">AWS access keys (SigV4)</option>
          </select>
          <small>Otto stores these credentials unencrypted in this browser profile. Prefer a Bedrock API key or short-lived credentials from an IAM user scoped to <code>bedrock-mantle:CreateInference</code>.</small>
        </label>

        <label data-field="apiKey">
          API key
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
          <small>Stored only on this device (chrome.storage.local). Never synced.</small>
        </label>

        <label data-field="accessKeyId">
          Access key ID
          <input id="accessKeyId" type="text" autocomplete="off" spellcheck="false" />
        </label>

        <label data-field="secretAccessKey">
          Secret access key
          <input id="secretAccessKey" type="password" autocomplete="off" spellcheck="false" />
        </label>

        <label data-field="sessionToken">
          Session token
          <input id="sessionToken" type="password" autocomplete="off" spellcheck="false" />
          <small>Optional. Needed only for temporary credentials.</small>
        </label>

        <label data-field="model">
          Model
          <input id="model" type="text" spellcheck="false" />
        </label>

        <label>
          Max groups
          <input id="maxGroups" type="number" min="0" max="30" />
          <small>A hint for the model. 0 means no limit.</small>
        </label>

        <label class="check">
          <input id="sendFullUrls" type="checkbox" />
          Send full URLs
        </label>
        <small>Off: Otto sends only the origin and path (no query string or fragment). On: full URLs, which can help grouping but may include tokens or search terms.</small>

        <label class="check">
          <input id="autoOrganize" type="checkbox" />
          Auto-organize new tabs
        </label>

        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="test">Test connection</button>
        </div>
        <p id="status" role="status"></p>
      </form>
      <p class="shortcut">Keyboard shortcut: set or change it at <code>chrome://extensions/shortcuts</code>.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
