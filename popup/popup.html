<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OttO</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img class="logo" src="../icons/icon48.png" alt="" width="20" height="20" />OttO</div>
      <button id="options-link" class="ghost icon" title="Options" aria-label="Options">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" /><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7 3.4 3.4" /></svg>
      </button>
    </header>

    <section id="setup" class="pad" hidden>
      <p class="lead">Connect an LLM provider so OttO can group your tabs.</p>
      <button id="open-options" class="primary wide">Open Options</button>
    </section>

    <section id="main" hidden>
      <div class="pad">
        <button id="organize" class="primary wide">
          <svg viewBox="0 0 16 16"><path d="M8 1.8 9.4 6.6 14.2 8 9.4 9.4 8 14.2 6.6 9.4 1.8 8 6.6 6.6Z" /></svg>
          <span>Organize window</span>
          <kbd id="shortcut" hidden></kbd>
        </button>
        <div class="row">
          <button id="collapse-all">
            <svg viewBox="0 0 16 16"><path d="m4.5 2.5 3.5 3.5 3.5-3.5M4.5 13.5 8 10l3.5 3.5" /></svg>
            Collapse all
          </button>
          <button id="expand-all">
            <svg viewBox="0 0 16 16"><path d="m4.5 6 3.5-3.5L11.5 6M4.5 10 8 13.5l3.5-3.5" /></svg>
            Expand all
          </button>
        </div>
        <p id="status" class="status" role="status"></p>
      </div>

      <label class="setting">
        <span>
          Auto-organize
          <small>Group new tabs as they load</small>
        </span>
        <input type="checkbox" id="auto" class="switch" />
      </label>

      <details id="duplicates" class="panel tabs-panel" open hidden>
        <summary class="panel-head">
          <h2>
            <svg class="chevron" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" /></svg>
            Duplicates <span id="duplicates-count" class="count"></span>
          </h2>
          <button id="duplicates-close-all" class="ghost">Close all</button>
        </summary>
        <ul id="duplicates-list" class="list"></ul>
      </details>

      <details id="stale" class="panel tabs-panel" open hidden>
        <summary class="panel-head">
          <h2>
            <svg class="chevron" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" /></svg>
            Stale tabs <span id="stale-count" class="count"></span>
          </h2>
          <button id="stale-close-all" class="ghost">Close all</button>
        </summary>
        <ul id="stale-list" class="list"></ul>
      </details>

      <details id="activity" class="panel" hidden>
        <summary class="panel-head">
          <h2>
            <svg class="chevron" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" /></svg>
            Recent activity
          </h2>
        </summary>
        <ol id="activity-list" class="list"></ol>
      </details>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
