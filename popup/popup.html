<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OttO</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img class="logo" src="../icons/icon48.png" alt="" width="20" height="20" />OttO</div>
      <button id="options-link" class="ghost icon" title="Options" aria-label="Options">
        <svg class="px-icon" viewBox="0 0 8 8" width="16" height="16" aria-hidden="true"><path d="M3 0h1v1h-1zM4 0h1v1h-1zM1 1h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1zM3 7h1v1h-1zM4 7h1v1h-1z"/></svg>
      </button>
    </header>

    <section id="setup" class="pad" hidden>
      <p class="lead">Connect an LLM provider so OttO can group your tabs.</p>
      <button id="open-options" class="primary wide">Open Options</button>
    </section>

    <section id="main" hidden>
      <div class="pad">
        <button id="organize" class="primary wide">
          <svg class="px-icon" viewBox="0 0 7 7" width="14" height="14" aria-hidden="true"><path d="M3 0h1v1h-1zM3 1h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"/></svg>
          <span>Organize window</span>
          <kbd id="shortcut" hidden></kbd>
        </button>
        <div class="row">
          <button id="collapse-all">
            <svg class="px-icon" viewBox="0 0 7 7" width="14" height="14" aria-hidden="true"><path d="M1 0h1v1h-1zM2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM5 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM3 2h1v1h-1zM3 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1z"/></svg>
            Collapse all
          </button>
          <button id="expand-all">
            <svg class="px-icon" viewBox="0 0 7 7" width="14" height="14" aria-hidden="true"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM3 6h1v1h-1z"/></svg>
            Expand all
          </button>
        </div>
        <p id="status" class="status" role="status"></p>
      </div>

      <label class="setting">
        <span>
          Auto-organize
          <small>Group new tabs as they load</small>
        </span>
        <input type="checkbox" id="auto" class="switch" />
      </label>

      <details id="duplicates" class="panel tabs-panel" open hidden>
        <summary class="panel-head">
          <h2>
            <svg class="px-icon chevron" viewBox="0 0 4 5" width="8" height="10" aria-hidden="true"><path d="M0 0h1v1h-1zM0 1h1v1h-1zM1 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM0 4h1v1h-1z"/></svg>
            Duplicates <span id="duplicates-count" class="count"></span>
          </h2>
          <button id="duplicates-close-all" class="ghost">Close all</button>
        </summary>
        <ul id="duplicates-list" class="list"></ul>
      </details>

      <details id="stale" class="panel tabs-panel" open hidden>
        <summary class="panel-head">
          <h2>
            <svg class="px-icon chevron" viewBox="0 0 4 5" width="8" height="10" aria-hidden="true"><path d="M0 0h1v1h-1zM0 1h1v1h-1zM1 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM0 4h1v1h-1z"/></svg>
            Stale tabs <span id="stale-count" class="count"></span>
          </h2>
          <button id="stale-close-all" class="ghost">Close all</button>
        </summary>
        <ul id="stale-list" class="list"></ul>
      </details>

      <details id="activity" class="panel" hidden>
        <summary class="panel-head">
          <h2>
            <svg class="px-icon chevron" viewBox="0 0 4 5" width="8" height="10" aria-hidden="true"><path d="M0 0h1v1h-1zM0 1h1v1h-1zM1 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM0 4h1v1h-1z"/></svg>
            Recent activity
          </h2>
        </summary>
        <ol id="activity-list" class="list"></ol>
      </details>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
