<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Otto</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1><img class="logo" src="../icons/icon48.png" alt="" width="28" height="28" />Otto</h1>
      <a id="options-link" href="#">Options</a>
    </header>

    <section id="setup" hidden>
      <p>Otto needs an LLM provider and API key before it can organize tabs.</p>
      <button id="open-options" class="primary">Open Options</button>
    </section>

    <section id="main" hidden>
      <button id="organize" class="primary">Organize this window</button>
      <div class="row">
        <button id="collapse-all">Collapse all groups</button>
        <button id="expand-all">Expand all groups</button>
      </div>
      <p id="status" role="status"></p>

      <label class="toggle">
        <input type="checkbox" id="auto" />
        Auto-organize new tabs
      </label>

      <div id="duplicates" hidden>
        <div class="dup-header">
          <h2>Duplicates</h2>
          <button id="close-all">Close all duplicates</button>
        </div>
        <ul id="dup-list"></ul>
      </div>

      <details id="activity" hidden>
        <summary>Recent activity</summary>
        <ol id="activity-list"></ol>
      </details>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
